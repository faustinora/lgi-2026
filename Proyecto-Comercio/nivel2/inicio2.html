<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Nivel 2</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    
    <style>
        body {
            background-color: #04464b;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        main.container {
            max-width: 900px;
        }

        .titulo-principal {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .mensaje-alerta {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-weight: bold;
        }

        .mensaje-error {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        .mensaje-exito {
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        table.tabla-productos {
            border-collapse: collapse;
            width: 100%;
            border: 1px solid #cbd5e1;
        }

        table.tabla-productos th, 
        table.tabla-productos td {
            border: 1px solid #cbd5e1;
            padding: 0.6rem 0.8rem;
        }

        table.tabla-productos thead th {
            background-color: #1e293b;
            color: #ffffff;
        }

        table.tabla-productos tbody tr {
            background-color: #ffffff;
        }

        table.tabla-productos tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .col-acciones {
            width: 1%;
            white-space: nowrap;
            text-align: center !important;
        }

        .btn-accion {
            padding: 0.25rem 0.5rem;
            font-size: 0.85rem;
            margin-right: 0.25rem;
        }
    </style>
</head>
<body>

<main class="container">
    <article>
        <header>
            <h1 class="titulo-principal" style="margin-bottom: 0;">Productos</h1>
        </header>
        
        <div id="contenedorMensaje"></div>

        <form id="formularioCrear">
            <label for="codigo">Código
                <input type="text" id="codigo" placeholder="Ej. 0001" required>
            </label>

            <label for="nombre">Nombre
                <input type="text" id="nombre" placeholder="Ej. Azúcar" required>
            </label>

            <label for="precio">Precio
                <input type="number" step="0.01" id="precio" placeholder="Ej. 19.99" required>
            </label>

            <label for="stock">Stock
                <input type="number" id="stock" placeholder="Ej. 10" required>
            </label>

            <button type="submit" id="btnGuardar" class="contrast" style="margin-top: 1rem;">Guardar Producto</button>
        </form>

        <hr style="margin: 2rem 0;">

        <div class="grid" style="margin-bottom: 1rem;">
        <article style="padding: 1rem; text-align: center; background-color: #f7f9fa;">
            <small>Total Inventario</small>
            <h3 id="spanTotalInventario" style="margin: 0; color: #2e7d32;">$0.00</h3>
        </article>
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="inputBuscador">
                <strong>Buscar:</strong>
                <input type="search" id="inputBuscador" placeholder="Escriba código, nombre o precio...">
            </label>
        </div>

        <h2>Lista</h2>
        <div class="overflow-auto">
            <table class="tabla-productos">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th class="col-acciones">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">

                </tbody>
            </table>
        </div>

        <footer>
            <small id="totalProductos"><strong>Total:</strong> 0 productos</small>
        </footer>
    </article>
</main>

<dialog id="modalEditar">
    <article style="max-width: 500px;">
        <header>
            <button aria-label="Cerrar" rel="prev" onclick="cerrarModal()"></button>
            <h3>Editar</h3>
        </header>

        <form id="formularioEditar">
            <input type="hidden" id="editId">

            <label for="editCodigo">Código
                <input type="text" id="editCodigo" required>
            </label>

            <label for="editNombre">Nombre
                <input type="text" id="editNombre" required>
            </label>

            <label for="editPrecio">Precio
                <input type="number" step="0.01" id="editPrecio" required>
            </label>

            <label for="editStock">Stock
                <input type="number" id="editStock" required>
            </label>

            <footer>
                <button type="button" class="secondary outline" onclick="cerrarModal()">Cancelar</button>
                <button type="submit" id="btnActualizar">Guardar</button>
            </footer>
        </form>
    </article>
</dialog>

<script src="js/ejercicio2.js"></script>
</body>
</html>
